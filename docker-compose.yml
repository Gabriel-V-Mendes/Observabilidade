# ==============================================================================
# Docker Compose — Stack Completa de Observabilidade & SLOs
#
# Mudanças em relação à versão legada:
#   1. Saiu o Promtail (descontinuado) -> Entrou o Grafana Alloy (`grafana/alloy:v1.7.1`)
#   2. Todas as imagens têm versão fixada (zero `:latest`)
#   3. Todos os serviços possuem healthchecks/limites de recursos, permitindo subir
#      e validar toda a plataforma com um único comando:
#        docker compose up -d --build --wait
# ==============================================================================
services:
  # 1. API FastAPI instrumentada (Métricas RED + Logs Estruturados JSON)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-observability-api}
      - APP_VERSION=${APP_VERSION:-2.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped
    networks:
      - observability_net

  # 2. Prometheus — Coleta de métricas, Recording Rules de SLI/SLO e motor de alertas
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    networks:
      - observability_net

  # 3. Node Exporter — Métricas de hardware e SO do host (CPU, RAM, Disco, Rede)
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks:
      - observability_net

  # 4. Alertmanager — Deduplicação, agrupamento, inibição e roteamento (Webhook/Slack/Discord/Email)
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks:
      - observability_net

  # 5. Grafana Loki — Agregador de logs indexado por labels (Schema v13 TSDB)
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped
    networks:
      - observability_net

  # 6. Grafana Alloy — Coletor moderno de telemetria (substitui o Promtail descontinuado)
  alloy:
    image: grafana/alloy:v1.7.1
    container_name: alloy
    user: root
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped
    networks:
      - observability_net

  # 7. Grafana — Visualização com Datasources e Dashboards provisionados via código (IaC)
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped
    networks:
      - observability_net

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  observability_net:
    driver: bridge

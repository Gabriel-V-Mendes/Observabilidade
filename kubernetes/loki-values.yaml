# ==============================================================================
# Grafana Loki — Helm Values para o Novo Repositório Oficial (Março/2026+)
#
# ATENÇÃO (Mudança de Repositório em 16/03/2026):
#   O chart open-source do Loki saiu do repositório legado `grafana/loki`
#   (congelado na v6.55.0, mantido apenas para o Grafana Enterprise Logs) e
#   migrou oficialmente para o repositório `grafana-community/helm-charts`
#   (distribuído via HTTPS e OCI no GHCR).
#
# Instalação via OCI (Recomendado em 2026):
#   helm upgrade --install loki oci://ghcr.io/grafana-community/helm-charts/loki \
#     --namespace monitoring --create-namespace \
#     -f kubernetes/loki-values.yaml
#
# Instalação via Repositório Helm HTTPS tradicional:
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install loki grafana-community/loki \
#     --namespace monitoring --create-namespace \
#     -f kubernetes/loki-values.yaml
# ==============================================================================

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

# Desabilita componentes de modo distribuído (SimpleScalable/Distributed) em lab/single-node
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

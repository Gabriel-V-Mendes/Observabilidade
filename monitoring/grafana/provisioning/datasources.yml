# ==============================================================================
# Grafana Datasources as Code — Prometheus (Métricas) + Loki (Logs via Alloy)
# Fixamos os UIDs (`prometheus` e `loki`) para vinculação determinística nos JSONs.
# ==============================================================================
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "5s"

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

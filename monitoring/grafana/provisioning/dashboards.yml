# ==============================================================================
# Grafana Dashboard Provider — Carrega automaticamente os JSONs versionados no Git
# ==============================================================================
apiVersion: 1
providers:
  - name: "SRE Dashboards"
    orgId: 1
    folder: "SRE & SLOs"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards-json

apiVersion: 1
providers:
  # Carrega dashboards automaticamente de uma pasta no disco.
  # Qualquer JSON que a gente jogar nessa pasta vira dashboard no Grafana — zero clique.
  - name: 'Default Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10  # Verifica mudanças a cada 10s (ótimo pra dev)
    options:
      path: /etc/grafana/provisioning/dashboards
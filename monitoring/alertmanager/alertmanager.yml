# ==============================================================================
# Alertmanager — Roteamento, Agrupamento, Inibição e Notificações (Slack/Discord/Email)
#
# Por segurança (Zero Segredos no Git), nenhuma chave real de Slack/Discord/SMTP
# é versionada neste arquivo. Por padrão, os alertas são entregues no receptor
# webhook local da plataforma (`http://app:8000/webhook/alerts`) e os blocos de
# Slack, Discord e E-mail estão prontos para ativação via variáveis/secrets.
# ==============================================================================
global:
  resolve_timeout: 3m

route:
  receiver: "sre-MultiChannel"
  group_by: ["alertname", "severity", "category"]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h
  routes:
    # Alertas críticos (TargetDown, SLOErrorBudgetBurnFast, HighLatencyP99) têm despacho imediato
    - matchers:
        - severity = "critical"
      receiver: "sre-MultiChannel"
      group_wait: 2s
      repeat_interval: 30m

    # Alertas de warning têm agrupamento mais suave para evitar fadiga de alertas
    - matchers:
        - severity = "warning"
      receiver: "sre-MultiChannel"
      group_wait: 10s
      repeat_interval: 2h

# Regra de Inibição: se o componente inteiro caiu (TargetDown), silencia alertas derivados
# de queima lenta ou warning para que o plantonista foque na causa primária.
inhibit_rules:
  - source_matchers:
      - alertname = "TargetDown"
    target_matchers:
      - severity = "warning"
    equal: ["environment"]

  - source_matchers:
      - alertname = "SLOErrorBudgetBurnFast"
    target_matchers:
      - alertname = "SLOErrorBudgetBurnSlow"
    equal: ["slo"]

receivers:
  - name: "sre-MultiChannel"
    # 1. Webhook ativo por padrão no laboratório (permite auditar alertas em GET /webhook/alerts)
    webhook_configs:
      - url: "http://app:8000/webhook/alerts"
        send_resolved: true

    # 2. Exemplo de integração com Slack (descomente e injete o webhook fora do Git):

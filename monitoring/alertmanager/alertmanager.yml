# ==============================================================================
# Alertmanager — Roteamento, Agrupamento, Inibição e Notificações
#
# O receptor webhook roda em um contêiner separado (`http://webhook-receiver:8081/webhook/alerts`),
# fora da API monitorada (`fastapi-app`). Assim, mesmo quando `fastapi-app` sofre
# queda total (`TargetDown`), o Alertmanager entrega a notificação normalmente e
# o Tempo de Detecção (TTD) é medido até a notificação efetivamente entregue.
# ==============================================================================
global:
  resolve_timeout: 3m

route:
  receiver: "sre-MultiChannel"
  group_by: ["alertname", "severity", "category", "job"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    # Alertas críticos (TargetDown, SLOErrorBudgetBurnFast, HighLatencyP99) têm despacho imediato
    - matchers:
        - severity = "critical"
      receiver: "sre-MultiChannel"
      group_wait: 2s
      group_interval: 5s
      repeat_interval: 30m

    # Alertas de warning têm agrupamento mais suave para evitar fadiga de alertas
    - matchers:
        - severity = "warning"
      receiver: "sre-MultiChannel"
      group_wait: 10s
      group_interval: 15s
      repeat_interval: 2h

# Regra de Inibição: se o componente inteiro caiu (TargetDown), silencia alertas derivados
# de queima lenta ou warning para que a equipe foque na causa primária.
inhibit_rules:
  - source_matchers:
      - alertname = "TargetDown"
    target_matchers:
      - severity = "warning"
    equal: ["environment"]

  - source_matchers:
      - alertname = "SLOErrorBudgetBurnFast"
    target_matchers:
      - alertname = "SLOErrorBudgetBurnSlow"
    equal: ["slo"]

receivers:
  - name: "sre-MultiChannel"
    # 1. Receptor de Webhook dedicado em contêiner separado (fora da API monitorada)
    webhook_configs:
      - url: "http://webhook-receiver:8081/webhook/alerts"
        send_resolved: true


# ==============================================================================
# Prometheus — Coleta de Métricas (RED + Node Exporter + Stack) e Avaliação de SLOs
# ==============================================================================
global:
  scrape_interval: 5s      # Coleta a cada 5s para detecção rápida no laboratório (Game Day)
  evaluation_interval: 5s  # Avalia recording rules e alertas a cada 5s
  external_labels:
    environment: "lab-sre"
    project: "observability-slo"

# Carrega Recording Rules de SLI/SLO e Regras de Alerta
rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alerts.yml

# Despacha alertas ativos para o Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1. API FastAPI instrumentada (Métricas RED: Rate, Errors, Duration)
  - job_name: "fastapi-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "observability-api"

  # 2. Receptor externo de Webhooks do Alertmanager (contêiner separado da API)
  - job_name: "webhook-receiver"
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-receiver:8081"]
        labels:
          service: "alert-webhook-receiver"

  # 3. Node Exporter — telemetria de infraestrutura do host (CPU, RAM, Disco, Rede)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-node"

  # 4. Auto-monitoramento do próprio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 5. Monitoramento do coletor de logs Grafana Alloy
  - job_name: "grafana-alloy"
    static_configs:
      - targets: ["alloy:12345"]

  # 6. Monitoramento do Grafana Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # 7. Monitoramento do Alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
